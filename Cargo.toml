[workspace]
resolver = "2"
members = ["crates/core", "src-tauri", "fixtures"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Keep dev builds small: full debug info made target/ several GB.
[profile.dev]
debug = "line-tables-only"
incremental = true

# Unoptimized hashing, walking and regex made `tauri dev` scans many times slower than release.
# Dependencies and the core compile optimized; the thin shell stays fast to rebuild.
[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.dev.package.duobolt-core]
opt-level = 3
