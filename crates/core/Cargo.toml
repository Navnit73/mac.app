[package]
name = "mymacstorage-core"
description = "MyMacStorage core: all filesystem logic, no UI or Tauri dependency"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
crossbeam-channel = "0.5.17"
globset = "0.4.21"
libc = "0.2.191"
memchr = "2.8.3"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = "0.3.2"
plist = "1.10.3"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
ts-rs = "12.0.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.12.0"
tempfile = "3.27.0"

[[bench]]
name = "scan"
harness = false
