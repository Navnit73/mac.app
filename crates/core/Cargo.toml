[package]
name = "duobolt-core"
description = "DuoBolt core: all filesystem logic, no UI or Tauri dependency"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
globset = "0.4.21"
libc = "0.2.191"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
plist = "1.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
ts-rs = "12.0.1"

[dev-dependencies]
criterion = "0.8.2"
serde_json = "1.0.154"
tempfile = "3.27.0"

[[bench]]
name = "scan"
harness = false
