[package]
name = "mymacstorage"
description = "MyMacStorage Tauri shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "mymacstorage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mymacstorage-core = { path = "../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tracing = "0.1.44"
# Native TLS (Security.framework) for the app API: no bundled crypto to compile.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query"] }
tokio = { version = "1", features = ["time", "sync"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = "12.0.1"
