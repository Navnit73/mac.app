[package]
name = "duobolt"
description = "DuoBolt Tauri shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "duobolt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
duobolt-core = { path = "../crates/core" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tracing = "0.1.44"
ts-rs = "12.0.1"
